[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sonic-transfer"
version = "0.1.0"
description = "Reliable file transfer over a bidirectional audio cable"
requires-python = ">=3.11"
dependencies = ["sounddevice>=0.4.6", "cryptography>=41"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
